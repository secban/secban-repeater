# SecBan Repeater Configuration

# Log level: debug, info, warn, error
log_level: info

# UNIX socket path where secban-repeater listens for IPC events from the local agent
socket_path: /var/run/secban/repeater.sock

# HTTP request timeout per agent call
timeout: 5s

# List of secban-agent endpoints to repeat bans to.
# Supports HTTP/HTTPS (e.g. http://10.0.0.2:8080)
agents: []
# agents:
#   - http://192.168.0.19:8080

# Optional ban mapping from local ban to remote ban name. Use if the target agent uses a different naming convention for bans.
rules_map: {}
# rules_map:
#   local_ban_name: remote_ban_name

# Profiler endpoint. Set to an empty value to disable. PPROF information will be at /debug/pprof/.
profiler: ""
# profiler: localhost:6063
